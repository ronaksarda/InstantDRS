<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InstantDRS | Contact Us</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #0a0a0a; color: #f8fafc; }
        .dotted-bg {
            position: fixed; inset: 0; z-index: 0;
            background-image: radial-gradient(circle, rgba(255,255,255,0.12) 1px, transparent 1px);
            background-size: 28px 28px;
            mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 40%, transparent 100%);
            -webkit-mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 40%, transparent 100%);
            pointer-events: none;
        }
        .glow-blob { position: fixed; border-radius: 50%; filter: blur(120px); pointer-events: none; z-index: 0; }
        .glass-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center relative overflow-hidden">
    <div class="dotted-bg"></div>
    <div class="glow-blob" style="width:500px;height:500px;top:-150px;right:-100px;background:radial-gradient(circle,rgba(59,130,246,0.1),transparent)"></div>
    
    <div class="glass-card w-full max-w-md p-8 rounded-3xl shadow-2xl relative z-10 m-4 text-center">
        <h1 class="text-3xl font-black uppercase tracking-tighter text-white mb-2">Contact <span class="text-pink-500">Support</span></h1>
        <p class="text-sm font-semibold text-slate-400 mb-8">For technical support or inquiries about InstantDRS.</p>
        
        <div class="space-y-4 mb-8 text-left">
            <div class="bg-slate-900/50 p-4 rounded-xl border border-white/5">
                <p class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-1">Email</p>
                <a href="mailto:support@instantdrs.com" class="text-blue-400 font-semibold">support@instantdrs.com</a>
            </div>
            <div class="bg-slate-900/50 p-4 rounded-xl border border-white/5">
                <p class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-1">Phone</p>
                <a href="tel:+18005550199" class="text-white font-semibold">+1 (800) 555-0199</a>
            </div>
        </div>
        
        <div class="border-t border-white/10 pt-6">
            <a href="/" class="text-slate-500 hover:text-white text-xs font-bold uppercase tracking-widest transition-colors">
                ← Back to Emergency Reporter
            </a>
        </div>
    </div>
</body>
</html>
