<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InstantDRS | Secure Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #0a0a0a; color: #f8fafc; }
        .dotted-bg {
            position: fixed; inset: 0; z-index: 0;
            background-image: radial-gradient(circle, rgba(255,255,255,0.12) 1px, transparent 1px);
            background-size: 28px 28px;
            mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 40%, transparent 100%);
            -webkit-mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 40%, transparent 100%);
            pointer-events: none;
        }
        .glow-blob { position: fixed; border-radius: 50%; filter: blur(120px); pointer-events: none; z-index: 0; }
        .glass-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center relative overflow-hidden">
    <div class="dotted-bg"></div>
    <div class="glow-blob" style="width:500px;height:500px;top:-150px;right:-100px;background:radial-gradient(circle,rgba(59,130,246,0.1),transparent)"></div>
    <div class="glow-blob" style="width:400px;height:400px;bottom:-100px;left:-80px;background:radial-gradient(circle,rgba(219,39,119,0.08),transparent)"></div>

    <div class="glass-card w-full max-w-md p-8 rounded-3xl shadow-2xl relative z-10 m-4">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-black uppercase tracking-tighter text-white mb-2">Instant<span class="text-blue-500">DRS</span></h1>
            <p class="text-sm font-semibold text-slate-400 uppercase tracking-widest">Command Center Access</p>
        </div>

        {% if error %}
        <div class="mb-6 p-4 rounded-xl bg-red-500/10 border border-red-500/20 text-red-400 text-sm font-semibold text-center">
            {{ error }}
        </div>
        {% endif %}

        <form action="/login" method="POST" class="space-y-6">
            <div>
                <label for="username" class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Username</label>
                <input type="text" id="username" name="username" required
                    class="w-full px-4 py-3 bg-slate-900/50 border border-white/10 rounded-xl outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50 text-white placeholder:text-slate-600 transition-all"
                    placeholder="Enter admin username">
            </div>
            
            <div>
                <label for="password" class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Password</label>
                <input type="password" id="password" name="password" required
                    class="w-full px-4 py-3 bg-slate-900/50 border border-white/10 rounded-xl outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50 text-white placeholder:text-slate-600 transition-all"
                    placeholder="Enter master pin">
            </div>

            <button type="submit" 
                class="w-full py-4 bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-bold uppercase tracking-widest text-sm transition-all shadow-lg shadow-blue-500/25 border border-blue-400/50 hover:-translate-y-0.5">
                Authenticate
            </button>
        </form>
        
        <div class="mt-8 text-center border-t border-white/10 pt-6">
            <a href="/" class="text-slate-500 hover:text-white text-xs font-bold uppercase tracking-widest transition-colors">
                ← Back to Emergency Reporter
            </a>
        </div>
    </div>
</body>
</html>
